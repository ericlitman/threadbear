name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting and production size
        run: |
          files=$(find . -type f -name '*.go' ! -path './.git/*' ! -path './.worktrees/*' | sort)
          test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
          production=$(printf '%s\n' "$files" | awk '!/_test\.go$/')
          lines=$(printf '%s\n' "$production" | xargs wc -l | awk 'END { print $1 }')
          echo "production Go lines: $lines"
          test "$lines" -le 1000
      - run: go test ./...
      - run: go vet ./...
      - name: Validate experiment registry
        run: python3 scripts/validate-experiments.py
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/threadbear_darwin_arm64 ./cmd/threadbear
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/threadbear_darwin_amd64 ./cmd/threadbear
      - run: sh -n install.sh
      - run: cmp install.sh site/install.sh
      - run: cmp INSTALL.md site/install
      - name: Check static site links
        run: |
          python3 -m http.server 8000 --directory site >/tmp/threadbear-site.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          for path in / /install /install.sh; do
            curl --fail --silent --show-error "http://127.0.0.1:8000$path" >/dev/null
          done
