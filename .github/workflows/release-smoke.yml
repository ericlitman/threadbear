name: Release smoke

on:
  workflow_call:
    inputs:
      tag:
        description: Published current release tag (vN.N.N)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published current release tag (vN.N.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Resolve published tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { ok=1 } END { exit(ok ? 0 : 1) }'; then
            echo "release smoke requires the published current stable-shaped vN.N.N tag" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Execute published install command
        id: smoke
        run: scripts/release-smoke.sh "${{ steps.release.outputs.tag }}"
      - name: Record smoke scope
        if: always()
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "### ThreadBear release smoke"
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Result: \`$SMOKE_OUTCOME\`"
            echo "- Runner architecture: \`$(uname -m)\`"
            echo "- Proved: published bootstrap, manifest, checksum, candidate version and self-test; dry-run collision refusal; exact 2.2.1 reset fingerprint, --reset gate, filesystem reset, and teardown; title-core readiness without the updater; a one-read current-title plan with zero production title writes plus an exact simulated mounted native setter success and one-attempt failure; complete multi-page onboarding preview with deduplication and failure-before-writes; uncapped complete-snapshot subject preparation with zero per-target production RPCs, followed by simulated serial mounted read-before-set revalidation, drift skipping, one-attempt writes, exact accounting, and no retry; no hooks.json mutation or SQLite dependency; real-launchd automatic and direct current updates with restart reporting; an update/uninstall overlap; and complete uninstall JSON with binary-last teardown and unrelated-content preservation."
            echo "- Not proved: real Codex auth, native automation deletion or exact-task unpin, rendered Desktop repaint, clean-restart persistence, native timeout behavior, a newer-version partial update, or architectures other than this runner. Those seams require the recorded local Desktop and fault-injection canaries."
            echo "- Deployment timing: a Pages/CDN lag can make the live bootstrap older than the release commit; that red result still requires operator investigation."
            echo "- A red result marks the published release for operator action; this workflow does not delete, demote, or retry a release."
          } >> "$GITHUB_STEP_SUMMARY"
